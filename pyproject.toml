[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "issue-rca-agent"
version = "0.1.0"
description = "A LangGraph multi-agent system for GitHub Issue root-cause analysis and code localization."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
authors = [{name = "IssueRCA-Agent Contributors"}]
dependencies = [
  "composio>=0.27,<0.28",
  "httpx>=0.28,<1",
  "langgraph>=1.0,<2",
  "openai>=2.0,<3",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-dotenv>=1.0,<2",
  "rich>=13.9,<15",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]
lsp = [
  "multilspy>=0.0.15,<0.2",
]
rag = [
  "hdbscan>=0.8.40,<1",
  "scikit-learn>=1.5,<2",
  "sentence-transformers>=3,<6",
]

[project.scripts]
issue-rca = "issue_rca.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
issue_rca = ["fixtures/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
